<!-- Module 2 - Activity 1 - Your Portfolio: Skeleton + Flexbox Layout

  Build YOUR OWN single-page portfolio - the one you wireframed in Week 1.
  Keep your wireframe open beside you; it is the blueprint. (No wireframe yet?
  You may fall back to the Curbside Thai content for this activity.)

  Layout only this week - no colours or fonts yet. Replace this comment with a
  complete page.

  1. Start from a valid HTML5 skeleton (doctype, <html lang>, head with title +
     UTF-8 charset, and a short HTML comment describing the page).
  2. Create a file styles.css and LINK it from the head. From now on ALL styling
     lives in the stylesheet - never a style="" attribute on an element.
  3. Build the body with semantic sections from your wireframe: header (site
     name + nav), a hero, an about section, a projects section, a contact area,
     and a footer. Use header/nav/main/section/footer, not generic boxes.
  4. In the nav, an unordered list of links (in-page links like href="#projects"
     are fine for one page).
  5. With Flexbox (in styles.css): make the nav list a horizontal row with the
     bullets removed and a gap; lay the header out as a row with the site name
     and nav at opposite ends, centred vertically; lay the hero out as a row
     (text one side, image placeholder the other).
  6. Give the page a max-width and centre it, with padding so content never
     touches the screen edges.

  Research: linking a stylesheet, element vs class selectors, the box model,
  max-width with auto margins, and Flexbox (flex container, justify/align, gap).
  Style by CLASS, not IDs. Greyscale only. Delete this comment when it works.
-->
